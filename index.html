
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DTX Image Uploader</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:grid;place-items:center;
  background:#09090f;color:#fff;font-family:Arial,sans-serif;
  padding:20px
}
.card{
  width:100%;max-width:480px;padding:28px;
  background:#14141f;border:1px solid #303044;
  border-radius:20px;text-align:center
}
h1{color:#ff304f}
#drop{
  margin:24px 0;padding:35px 12px;
  border:2px dashed #ff304f;border-radius:14px;
  cursor:pointer;background:#1b1722
}
#preview{max-width:100%;max-height:250px;border-radius:10px}
button{
  padding:12px 18px;border:0;border-radius:9px;
  background:#ff304f;color:white;font-weight:bold;
  cursor:pointer;margin:5px
}
input{width:100%;padding:12px;border-radius:8px;
background:#09090f;color:white;border:1px solid #444}
#status{color:#aaa;font-size:14px}
</style>
</head>
<body>
<div class="card">
  <h1>DTX Image Uploader</h1>
  <p>Paste, select or drop an image</p>

  <div id="drop" tabindex="0">
    <p>📷 Paste your image with Ctrl + V</p>
    <p>or click to select an image</p>
    <input id="file" type="file" accept="image/*">
    <div id="previewBox"></div>
  </div>

  <button id="upload">Upload Image</button>
  <p id="status">Choose an image to get started.</p>
  <input id="link" placeholder="Your image link will appear here" readonly>
  <button id="copy">Copy Link</button>
</div>

<script>
let selectedFile = null;
const fileInput = document.getElementById('file');
const drop = document.getElementById('drop');
const statusText = document.getElementById('status');
const linkInput = document.getElementById('link');
const previewBox = document.getElementById('previewBox');

function selectImage(file) {
  if (!file || !file.type.startsWith('image/')) {
    statusText.textContent = 'Please select a valid image.';
    return;
  }
  selectedFile = file;
  linkInput.value = '';
  previewBox.replaceChildren();
  const img = document.createElement('img');
  img.id = 'preview';
  img.alt = 'Image preview';
  img.src = URL.createObjectURL(file);
  previewBox.appendChild(img);
  statusText.textContent = 'Image ready. Click Upload Image.';
}

fileInput.addEventListener('change', () => selectImage(fileInput.files[0]));

document.addEventListener('paste', e => {
  const items = [...(e.clipboardData?.items || [])];
  const item = items.find(x => x.type.startsWith('image/'));
  if (item) selectImage(item.getAsFile());
});

drop.addEventListener('dragover', e => e.preventDefault());
drop.addEventListener('drop', e => {
  e.preventDefault();
  selectImage(e.dataTransfer.files[0]);
});

document.getElementById('upload').addEventListener('click', () => {
  if (!selectedFile) {
    statusText.textContent = 'Pehle image paste ya select karo.';
    return;
  }
  statusText.textContent =
    'Image preview ready hai, lekin online upload ke liye hosting API connect karni hogi.';
});

document.getElementById('copy').addEventListener('click', async () => {
  if (!linkInput.value) {
    statusText.textContent = 'Pehle image upload karke link generate karo.';
    return;
  }
  try {
    await navigator.clipboard.writeText(linkInput.value);
    statusText.textContent = 'Link copied!';
  } catch {
    linkInput.select();
    statusText.textContent = 'Link select ho gaya. Ctrl + C dabao.';
  }
});
</script>
</body>
</html>
